<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MBA Details | Career Portal</title>

<link rel="stylesheet" href="../assets/css/mba.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header class="header">

<div class="logo">
Career<span>Portal</span>
</div>

<a href="after-graduation.html" class="back-btn">
<i class="fa-solid fa-arrow-left"></i>
Back
</a>

</header>

<section class="mba-container">

<h1>MBA Details</h1>

<p>Select your MBA specialization</p>

<form id="mbaForm">

<h2>Select MBA Specialization</h2>

<div class="course-box">

<label>
<input type="radio" name="specialization" value="Finance">
<div>
<i class="fa-solid fa-coins"></i>
<h3>Finance</h3>
</div>
</label>

<label>
<input type="radio" name="specialization" value="Marketing">
<div>
<i class="fa-solid fa-bullhorn"></i>
<h3>Marketing</h3>
</div>
</label>

<label>
<input type="radio" name="specialization" value="Human Resources">
<div>
<i class="fa-solid fa-users"></i>
<h3>Human Resources</h3>
</div>
</label>

<label>
<input type="radio" name="specialization" value="Business Analytics">
<div>
<i class="fa-solid fa-chart-line"></i>
<h3>Business Analytics</h3>
</div>
</label>

<label>
<input type="radio" name="specialization" value="Operations Management">
<div>
<i class="fa-solid fa-gears"></i>
<h3>Operations Management</h3>
</div>
</label>

<label>
<input type="radio" name="specialization" value="International Business">
<div>
<i class="fa-solid fa-earth-americas"></i>
<h3>International Business</h3>
</div>
</label>

<label>
<input type="radio" name="specialization" value="Digital Marketing">
<div>
<i class="fa-solid fa-globe"></i>
<h3>Digital Marketing</h3>
</div>
</label>

<label>
<input type="radio" name="specialization" value="Entrepreneurship">
<div>
<i class="fa-solid fa-lightbulb"></i>
<h3>Entrepreneurship</h3>
</div>
</label>

</div>

<div class="details-card">

<div class="input-group">
<label>College Name</label>
<input type="text" placeholder="Enter college name">
</div>

<div class="input-group">
<label>University Name</label>
<input type="text" placeholder="Enter university name">
</div>

<div class="input-group">
<label>Passout Year</label>
<input type="number" placeholder="Example: 2028">
</div>

<div class="input-group">
<label>Percentage / CGPA</label>
<input type="text" placeholder="Enter Percentage or CGPA">
</div>

</div>

<button type="submit">
Save & Continue
<i class="fa-solid fa-arrow-right"></i>
</button>

</form>

</section>

<script src="../assets/js/mba.js"></script>

</body>
</html>
