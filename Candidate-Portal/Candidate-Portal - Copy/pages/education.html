<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Education | Career Portal</title>

    <link rel="stylesheet" href="../assets/css/education.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- Header -->

<header class="edu-header">

    <div class="logo">
        Career<span>Portal</span>
    </div>

    <a href="candidate-dashboard.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Dashboard
    </a>

</header>

<!-- Education Section -->

<section class="education-container">

    <h1>
        Education Journey
    </h1>

    <p>
        Complete your education details step by step
    </p>

    <div class="education-card">

        <div class="edu-icon">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>

        <h2>
            What Next After 10th?
        </h2>

        <p>
            First, enter your 10th Class details and then continue with your education journey.
        </p>

        <button onclick="location.href='tenth-details.html'">

            Start Education Journey

            <i class="fa-solid fa-arrow-right"></i>

        </button>

    </div>

    <!-- Progress Steps -->

    <div class="education-steps">

        <div class="step active">

            <span>1</span>

            <p>10th Details</p>

        </div>

        <div class="step">

            <span>2</span>

            <p>After 10th</p>

        </div>

        <div class="step">

            <span>3</span>

            <p>Graduation</p>

        </div>

        <div class="step">

            <span>4</span>

            <p>Job Profile</p>

        </div>

        <div class="step">

            <span>5</span>

            <p>Review</p>

        </div>

    </div>

</section>

<script src="../assets/js/education.js"></script>

</body>

</html>
