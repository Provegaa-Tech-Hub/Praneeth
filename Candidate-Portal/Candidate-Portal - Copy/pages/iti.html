<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ITI Details | Career Portal</title>

<link rel="stylesheet" href="../assets/css/iti.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<header class="header">


<div class="logo">
Career<span>Portal</span>
</div>



<a href="after10th.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>


</header>





<section class="iti-container">


<h1>
ITI Details
</h1>


<p>
Enter your Industrial Training Institute details
</p>




<form id="itiForm">





<div class="details-card">



<div class="input-group">

<label>
ITI Institute Name
</label>


<input type="text"
placeholder="Enter ITI institute name"
required>

</div>






<div class="input-group">

<label>
Select ITI Trade
</label>


<select required>


<option value="">
Select Trade
</option>


<option>
Electrician
</option>


<option>
Fitter
</option>


<option>
Welder
</option>


<option>
COPA (Computer Operator and Programming Assistant)
</option>


<option>
Mechanic Motor Vehicle (MMV)
</option>


<option>
Draughtsman Civil
</option>


<option>
Electronics Mechanic
</option>


<option>
Turner
</option>


<option>
Machinist
</option>


<option>
Plumber
</option>


<option>
Surveyor
</option>


<option>
Refrigeration and Air Conditioning Technician
</option>


</select>


</div>







<div class="input-group">

<label>
Course Duration
</label>


<select required>


<option value="">
Select Duration
</option>


<option>
1 Year
</option>


<option>
2 Years
</option>


</select>


</div>







<div class="input-group">

<label>
Passout Year
</label>


<input type="number"
placeholder="Example: 2025"
required>


</div>






<div class="input-group">

<label>
Percentage / Grade
</label>


<input type="text"
placeholder="Enter percentage"
required>


</div>



</div>






<button type="submit">

Save & Next

<i class="fa-solid fa-arrow-right"></i>

</button>



</form>



</section>





<script src="../assets/js/iti.js"></script>


</body>

</html>
