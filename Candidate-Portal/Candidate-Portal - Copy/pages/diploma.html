<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diploma Details | Career Portal</title>

    <link rel="stylesheet" href="../assets/css/diploma.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<header class="header">

    <div class="logo">
        Career<span>Portal</span>
    </div>


    <a href="after10th.html" class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Back

    </a>

</header>





<section class="diploma-container">


    <h1>
        Diploma Details
    </h1>

<div class="input-group">

<label>
Diploma Course / Branch
</label>


<select required>

<option value="">
Select Diploma Course
</option>


<option>
Diploma in Computer Engineering (CSE)
</option>


<option>
Diploma in Electronics & Communication Engineering (ECE)
</option>


<option>
Diploma in Electrical & Electronics Engineering (EEE)
</option>


<option>
Diploma in Mechanical Engineering
</option>


<option>
Diploma in Civil Engineering
</option>


<option>
Diploma in Automobile Engineering
</option>


<option>
Diploma in Artificial Intelligence & Machine Learning
</option>


<option>
Diploma in Data Science
</option>


<option>
Diploma in Information Technology
</option>


<option>
Diploma in Chemical Engineering
</option>


<option>
Diploma in Metallurgical Engineering
</option>


<option>
Diploma in Agriculture Engineering
</option>


<option>
Diploma in Biomedical Engineering
</option>


<option>
Diploma in Mining Engineering
</option>


</select>

</div>
    <p>
        Enter your Diploma education details
    </p>




<form id="diplomaForm">



<div class="details-card">



<div class="input-group">

<label>
College / Polytechnic Name
</label>

<input type="text"
placeholder="Enter college name"
required>

</div>





<div class="input-group">

<label>
Branch / Course
</label>


<select required>

<option value="">
Select Branch
</option>

<option>
CSE
</option>

<option>
ECE
</option>

<option>
EEE
</option>

<option>
Mechanical
</option>

<option>
Civil
</option>

</select>

</div>





<div class="input-group">

<label>
Passout Year
</label>

<input type="number"
placeholder="Example: 2025"
required>

</div>





<div class="input-group">

<label>
Percentage / CGPA
</label>

<input type="text"
placeholder="Enter percentage"
required>

</div>




</div>




<button type="submit">

Save & Next

<i class="fa-solid fa-arrow-right"></i>

</button>



</form>



</section>



<script src="../assets/js/diploma.js"></script>


</body>

</html>
