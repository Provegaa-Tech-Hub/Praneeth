<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candidate Login | Career Portal</title>

    <link rel="stylesheet" href="assets/css/login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<div class="login-container">


    <!-- Left Image Section -->

    <div class="login-image">

        <div class="overlay">

            <h1>
                Welcome Back!
            </h1>

            <p>
                Continue your career journey and find your dream opportunity.
            </p>

        </div>

    </div>



    <!-- Login Box -->

    <div class="login-box">


        <h2>
            Candidate Login
        </h2>

        <p class="subtitle">
            Login to access your profile
        </p>



        <form>


            <div class="input-box">

                <i class="fa fa-envelope"></i>

                <input type="email"
                placeholder="Enter Email Address"
                required>

            </div>




            <div class="input-box">

                <i class="fa fa-lock"></i>

                <input type="password"
                placeholder="Enter Password"
                id="password"
                required>


                <i class="fa fa-eye"
                id="togglePassword"></i>

            </div>




            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>


                <a href="#">
                    Forgot Password?
                </a>

            </div>




            <button type="submit">

                Login

            </button>



        </form>



        <div class="or">

            <span>OR</span>

        </div>



        <button class="google-btn">

            <i class="fab fa-google"></i>

            Continue With Google

        </button>




        <p class="register-text">

            Don't have an account?

            <a href="register.html">
                Register Now
            </a>

        </p>



    </div>


</div>



<script src="assets/js/login.js"></script>


</body>

</html>
