<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>What Next After 10th? | Career Portal</title>

    <link rel="stylesheet" href="../assets/css/after10th.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>



<header class="header">


    <div class="logo">
        Career<span>Portal</span>
    </div>


    <a href="education.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Back
    </a>


</header>





<section class="after10-section">


    <h1>
        What Next After 10th?
    </h1>


    <p>
        Select your education path. Choose only one option.
    </p>



    <form id="educationForm">



        <div class="options-container">



            <!-- Intermediate -->

            <label class="option-card">


                <input type="radio" 
                name="education"
                value="intermediate">


                <div class="card-content">

                    <i class="fa-solid fa-school"></i>


                    <h2>
                        Intermediate
                    </h2>


                    <p>
                        11th & 12th Class
                    </p>


                    <span>
                        MPC | BiPC | MEC | CEC
                    </span>


                </div>


            </label>





            <!-- Diploma -->

            <label class="option-card">


                <input type="radio"
                name="education"
                value="diploma">


                <div class="card-content">


                    <i class="fa-solid fa-gears"></i>


                    <h2>
                        Diploma
                    </h2>


                    <p>
                        Polytechnic Education
                    </p>


                    <span>
                        Technical Courses
                    </span>


                </div>


            </label>





            <!-- ITI -->

            <label class="option-card">


                <input type="radio"
                name="education"
                value="iti">


                <div class="card-content">


                    <i class="fa-solid fa-screwdriver-wrench"></i>


                    <h2>
                        ITI
                    </h2>


                    <p>
                        Industrial Training
                    </p>


                    <span>
                        Trade Courses
                    </span>


                </div>


            </label>



        </div>




        <button type="submit">

            Save & Next

            <i class="fa-solid fa-arrow-right"></i>

        </button>



    </form>



</section>



<script src="../assets/js/after10th.js"></script>


</body>

</html>
