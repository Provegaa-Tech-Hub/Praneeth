<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Career Portal</title>

<link rel="stylesheet" href="../assets/css/profile.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header class="header">

<div class="logo">

<i class="fa-solid fa-user"></i>

<h2>Career Portal</h2>

</div>

<a href="candidate-dashboard.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Dashboard

</a>

</header>


<div class="profile-container">

<h1>Candidate Profile</h1>

<form id="profileForm">

<div class="photo-section">

<img src="../assets/images/profile/default.png"
id="profilePreview"
alt="Profile">

<input type="file"
id="profileImage"
accept="image/*">

</div>


<div class="form-grid">

<div class="input-group">

<label>Full Name</label>

<input
type="text"
id="fullName"
placeholder="Enter Full Name">

</div>

<div class="input-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter Email">

</div>

<div class="input-group">

<label>Mobile Number</label>

<input
type="text"
id="mobile"
placeholder="Enter Mobile Number">

</div>

<div class="input-group">

<label>Date of Birth</label>

<input
type="date"
id="dob">

</div>

<div class="input-group">

<label>Gender</label>

<select id="gender">

<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>

<div class="input-group">

<label>Aadhaar Number</label>

<input
type="text"
id="aadhaar"
maxlength="12"
placeholder="12 Digit Aadhaar">

</div>

<div class="input-group">

<label>PAN Number</label>

<input
type="text"
id="pan"
maxlength="10"
placeholder="ABCDE1234F">

</div>

<div class="input-group">

<label>Address</label>

<textarea
id="address"
rows="4"
placeholder="Enter Address"></textarea>

</div>

<div class="input-group">

<label>City</label>

<input
type="text"
id="city"
placeholder="City">

</div>

<div class="input-group">

<label>State</label>

<input
type="text"
id="state"
placeholder="State">

</div>

<div class="input-group">

<label>Pincode</label>

<input
type="text"
id="pincode"
maxlength="6"
placeholder="Pincode">

</div>

<div class="input-group">

<label>LinkedIn Profile</label>

<input
type="url"
id="linkedin"
placeholder="LinkedIn URL">

</div>

<div class="input-group">

<label>GitHub Profile</label>

<input
type="url"
id="github"
placeholder="GitHub URL">

</div>

</div>

<div class="button-group">

<button type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Save Profile

</button>

<button
type="button"
onclick="window.location.href='candidate-dashboard.html'">

<i class="fa-solid fa-house"></i>

Back to Dashboard

</button>

</div>

</form>

</div>

<script src="../assets/js/profile.js"></script>

</body>

</html>
