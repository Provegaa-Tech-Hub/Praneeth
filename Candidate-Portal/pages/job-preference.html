<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Job Profile | Career Portal</title>


<link rel="stylesheet" href="../assets/css/job-profile.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>



<header class="header">


<div class="logo">
Career<span>Portal</span>
</div>



<a href="after-graduation.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>


</header>







<section class="job-container">



<h1>
Job Profile Details
</h1>


<p>
Tell us about your career preferences
</p>






<form id="jobForm">







<h2>
Select Experience
</h2>




<div class="experience-box">





<label>


<input type="radio"
name="experience"
value="Fresher">


<div>

<i class="fa-solid fa-user-graduate"></i>

<h3>
Fresher
</h3>


</div>


</label>







<label>


<input type="radio"
name="experience"
value="Experienced">


<div>


<i class="fa-solid fa-user-tie"></i>

<h3>
Experienced
</h3>


</div>


</label>





</div>








<div class="details-card">






<div class="input-group">


<label>
Preferred Job Role
</label>


<input type="text"
placeholder="Example: Software Developer">


</div>







<div class="input-group">


<label>
Skills
</label>


<input type="text"
placeholder="Example: Java, Python, HTML">


</div>







<div class="input-group">


<label>
Preferred Location
</label>


<input type="text"
placeholder="Example: Hyderabad">


</div>







<div class="input-group">


<label>
Expected Salary
</label>


<input type="text"
placeholder="Example: 5 LPA">


</div>





</div>








<button type="submit">

Save & Continue

<i class="fa-solid fa-arrow-right"></i>

</button>





</form>




</section>







<script src="../assets/js/job-profile.js"></script>


</body>

</html>
