<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>10th Details | Career Portal</title>

    <link rel="stylesheet" href="../assets/css/tenth-details.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- Header -->

<header class="header">

    <div class="logo">

        <i class="fa-solid fa-graduation-cap"></i>

        <h2>Career Portal</h2>

    </div>

    <a href="education.html" class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Back

    </a>

</header>


<!-- Main Section -->

<section class="tenth-container">

    <div class="tenth-card">

        <div class="icon">

            <i class="fa-solid fa-school"></i>

        </div>

        <h1>10th Class Details</h1>

        <p>

            Please enter your Secondary School (10th) details.

        </p>

        <form id="tenthForm">

            <div class="input-group">

                <label>

                    School Name

                </label>

                <input
                    type="text"
                    id="schoolName"
                    placeholder="Enter School Name"
                    required>

            </div>

            <div class="input-group">

                <label>

                    Board

                </label>

                <select id="board" required>

                    <option value="">Select Board</option>

                    <option>SSC</option>

                    <option>CBSE</option>

                    <option>ICSE</option>

                    <option>State Board</option>

                    <option>Others</option>

                </select>

            </div>

            <div class="input-group">

                <label>

                    Hall Ticket Number

                </label>

                <input
                    type="text"
                    id="hallTicket"
                    placeholder="Enter Hall Ticket Number"
                    required>

            </div>

            <div class="input-group">

                <label>

                    School Location

                </label>

                <input
                    type="text"
                    id="schoolLocation"
                    placeholder="Enter School Location"
                    required>

            </div>

            <div class="input-group">

                <label>

                    Passout Year

                </label>

                <input
                    type="number"
                    id="schoolPassoutYear"
                    placeholder="2024"
                    required>

            </div>

            <div class="input-group">

                <label>

                    Percentage / CGPA

                </label>

                <input
                    type="text"
                    id="schoolPercentage"
                    placeholder="95% or 9.5 CGPA"
                    required>

            </div>

            <button type="submit">

                Save & Continue

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </form>

    </div>

</section>

<script src="../assets/js/tenth-details.js"></script>

</body>

</html>
