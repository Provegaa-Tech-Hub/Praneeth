<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>What Next After Graduation | Career Portal</title>


<link rel="stylesheet" href="../assets/css/after-graduation.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>




<header class="header">


<div class="logo">
Career<span>Portal</span>
</div>



<a href="graduation.html" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>


</header>







<section class="after-graduation-container">



<h1>
What Next After Graduation?
</h1>



<p>
Choose your career path after completing graduation
</p>







<form id="careerForm">






<div class="career-options">





<!-- Job -->


<label>


<input type="radio"
name="career"
value="Job">



<div class="career-card">


<i class="fa-solid fa-briefcase"></i>


<h2>
Job
</h2>


<p>
Start your professional career
</p>


</div>


</label>








<!-- M.Tech -->


<label>


<input type="radio"
name="career"
value="M.Tech">



<div class="career-card">


<i class="fa-solid fa-graduation-cap"></i>


<h2>
M.Tech
</h2>


<p>
Higher studies in technology
</p>


</div>


</label>









<!-- MBA -->


<label>


<input type="radio"
name="career"
value="MBA">



<div class="career-card">


<i class="fa-solid fa-chart-line"></i>


<h2>
MBA
</h2>


<p>
Management and business studies
</p>


</div>


</label>






</div>








<button type="submit">

Save & Continue

<i class="fa-solid fa-arrow-right"></i>

</button>





</form>






</section>







<script src="../assets/js/after-graduation.js"></script>



</body>

</html>
