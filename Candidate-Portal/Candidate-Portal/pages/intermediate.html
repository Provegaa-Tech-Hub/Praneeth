<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intermediate Details | Career Portal</title>

    <link rel="stylesheet" href="../assets/css/intermediate.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<header class="header">

    <div class="logo">
        Career<span>Portal</span>
    </div>


    <a href="after10th.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Back
    </a>

</header>





<section class="inter-container">


    <h1>
        Intermediate (11th & 12th)
    </h1>


    <p>
        Select your stream and enter your intermediate details
    </p>



<form id="interForm">



<!-- Stream Selection -->

<h2>
    Select Stream
</h2>



<div class="stream-box">


<label>

<input type="radio"
name="stream"
value="MPC">

<div>
<i class="fa-solid fa-calculator"></i>
<h3>MPC</h3>
</div>

</label>




<label>

<input type="radio"
name="stream"
value="BiPC">

<div>
<i class="fa-solid fa-dna"></i>
<h3>BiPC</h3>
</div>

</label>





<label>

<input type="radio"
name="stream"
value="MEC">

<div>
<i class="fa-solid fa-chart-line"></i>
<h3>MEC</h3>
</div>

</label>





<label>

<input type="radio"
name="stream"
value="CEC">

<div>
<i class="fa-solid fa-book"></i>
<h3>CEC</h3>
</div>

</label>



</div>





<!-- Details Form -->


<div class="details-card">


<div class="input-group">

<label>
College / School Name
</label>

<input type="text"
placeholder="Enter college name"
required>

</div>




<div class="input-group">

<label>
Board Name
</label>

<input type="text"
placeholder="Enter board name"
required>

</div>





<div class="input-group">

<label>
Passout Year
</label>

<input type="number"
placeholder="Example: 2024"
required>

</div>





<div class="input-group">

<label>
Percentage / CGPA
</label>

<input type="text"
placeholder="Enter percentage"
required>

</div>



</div>





<button type="submit">

Save & Next

<i class="fa-solid fa-arrow-right"></i>

</button>



</form>



</section>



<script src="../assets/js/intermediate.js"></script>


</body>

</html>
