<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:50px 20px;
}

.form-container{
    max-width:800px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 3px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#006B8F;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
}

textarea{
    resize:none;
}

.submit-btn{
    width:100%;
    background:#008000;
    color:white;
    border:none;
    padding:14px;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

.submit-btn:hover{
    background:#006400;
}

.back-btn{
    display:block;
    width:220px;
    margin:25px auto 0;
    text-align:center;
    background:#2563eb;
    color:#fff;
    text-decoration:none;
    padding:14px;
    border-radius:5px;
}

</style>
</head>

<body>

<div class="form-container">

    <h1>Job Application Form</h1>

    <form>

        <div class="form-group">
            <label>Full Name <span class="required">*</span></label>
<input type="text" required>
        </div>

        <div class="form-group">
           <label>Email Address <span class="required">*</span></label>
<input type="email" required>

        </div>

        <div class="form-group">
           <label>phone <span class="required">*</span></label>
<input type="tel" required>

        </div>

        <div class="form-group">
            <label>PAN / Aadhaar Number</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Looking For Job As</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Experience (Years)</label>
            <input type="number">
        </div>

        <div class="form-group">
            <label>Experience (Months)</label>
            <input type="number">
        </div>

        <div class="form-group">
            <label>Current Organization</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Current Annual Salary</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Expected Annual Salary</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Notice Period</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Present Location</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Willing To Relocate</label>
            <select>
                <option>Select</option>
                <option>Yes</option>
                <option>No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Upload Resume</label>
            <input type="file">
        </div>

        <button type="submit" class="submit-btn">
            Submit Application
        </button>

    </form>
    

</div>

<a href="Technical Jobs.html" class="back-btn">
    Back To Jobs
</a>

</body>
</html>
