        * {

            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 35px 20px;

            background:
                linear-gradient(
                    rgba(10, 20, 35, 0.55),
                    rgba(10, 20, 35, 0.55)
                ),
                url("images/study-abroad.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* MAIN APPLICATION */

        .education-page {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .education-application {
            width: 100%;
            max-width: 1050px;
            background: #ffffff;
            border: 1px solid #e2e2e2;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        /* STUDY ABROAD IMAGE */

        .study-abroad-top {
            width: 100%;
            height: 220px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            overflow: hidden;

            border-radius: 12px 12px 0 0;
        }

        .study-abroad-top img {
            width: 100%;
            height: 100%;

            object-fit: contain;
            object-position: center;

            display: block;
        }

        /* FORM */

        .education-form-side {
            width: 100%;
            padding: 38px 40px;
        }

        .education-form-container {
            width: 100%;
            max-width: 950px;
            margin: auto;
        }

        /* HEADER */

        .education-form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .education-form-header h1 {
            color: #073f73;
            font-size: 31px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .education-form-header p {
            color: #666;
            font-size: 14px;
        }

        /* ROW */

        .form-row {
            display: flex;
            gap: 18px;
            margin-bottom: 18px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .full-width {
            width: 100%;
            margin-bottom: 18px;
        }

        /* LABEL */

        label {
            color: #292929;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        label span {
            color: red;
        }

        /* INPUTS */

        input,
        select,
        textarea {
            width: 100%;
            height: 40px;
            padding: 9px 12px;
            border: 1px solid #cfcfcf;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0b6fa4;
            box-shadow: 0 0 0 2px rgba(11, 111, 164, 0.1);
        }

        textarea {
            height: auto;
            min-height: 90px;
            resize: vertical;
        }

        /* NAME */

        .three-column {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .three-column input {
            flex: 1;
        }

        /* DATE */

        .date-boxes {
            display: flex;
            gap: 8px;
        }

        .date-boxes input {
            flex: 1;
            min-width: 0;
        }

        /* AADHAAR */

        .aadhaar-boxes {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .aadhaar-input {
            width: 34px !important;
            min-width: 34px;
            height: 30px !important;
            padding: 0 !important;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
        }

        /* PAN */

        .pan-boxes {
            display: flex;
            gap: 5px;
            width: 100%;
        }

        .pan-input {
            width: 38px !important;
            min-width: 38px;
            height: 30px !important;
            padding: 0 !important;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* COUNTRY */

        .country-small {
            width: 70%;
            margin-bottom: 18px;
        }

        .country-small select {
            width: 100%;
        }

        /* SECTION HEADINGS */

        .section-heading {
            color: #073f73;
            font-size: 18px;
            font-weight: 700;
            margin: 8px 0 12px;
        }

        .parent-title {
            color: #292929;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 9px;
        }

        /* DOCUMENTS */

        .document-upload {
            display: flex;
            gap: 15px;
        }

        .upload-box {
            flex: 1;
        }

        .upload-box input {
            height: auto;
            padding: 9px;
            cursor: pointer;
        }

        /* BUTTON */

        .submit-area {
            text-align: center;
            margin-top: 28px;
        }

        .submit-btn {
            width: 210px;
            height: 45px;
            border: none;
            border-radius: 6px;
            background: #0077a8;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #005d83;
        }

        /* BACK */

        .back-area {
            text-align: center;
            margin-top: 12px;
        }

        .back-btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            body {
                padding: 15px;
            }

            .education-form-side {
                padding: 28px 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 15px;
            }

            .three-column {
                flex-direction: column;
            }

            .document-upload {
                flex-direction: column;
            }

            .aadhaar-boxes {

            }

                min-width: 28px;
                height: 30px !important;
            }

            .pan-input {
                width: 30px !important;
                min-width: 30px;
                height: 30px !important;
            }
        }

        @media (max-width: 500px) {

            .education-form-header h1 {
                font-size: 24px;
            }

            .education-form-side {
                padding: 25px 15px;
            }

            .aadhaar-boxes {
                flex-wrap: wrap;
            }

            .submit-btn {
                width: 100%;
            }
        }

</head>

<!-- =========================================================
     AADHAAR + PAN AUTO JUMP
========================================================= -->

<script>

    /* =====================================================
       AADHAAR
    ===================================================== */

    const aadhaarInputs =
        document.querySelectorAll(".aadhaar-input");

    aadhaarInputs.forEach((input, index) => {

        input.addEventListener("input", function () {

            this.value =
                this.value
                .replace(/\D/g, "")
                .slice(0, 1);

            if (
                this.value !== "" &&
                index < aadhaarInputs.length - 1
            ) {

                aadhaarInputs[index + 1].focus();

            }

        });


        input.addEventListener("keydown", function (event) {

            if (
                event.key === "Backspace" &&
                this.value === "" &&
                index > 0
            ) {

                aadhaarInputs[index - 1].focus();

            }

        });


        input.addEventListener("paste", function (event) {

            event.preventDefault();

            const pasted =
                (event.clipboardData || window.clipboardData)
                .getData("text")
                .replace(/\D/g, "")
                .slice(0, 12);

            pasted.split("").forEach((digit, i) => {

                if (aadhaarInputs[i]) {

                    aadhaarInputs[i].value = digit;

                }

            });

            if (pasted.length > 0) {

                const nextIndex =
                    Math.min(
                        pasted.length,
                        aadhaarInputs.length
                    ) - 1;

                aadhaarInputs[nextIndex].focus();

            }

        });

    });


    /* =====================================================
       PAN
    ===================================================== */

    const panInputs =
        document.querySelectorAll(".pan-input");

    panInputs.forEach((input, index) => {

        input.addEventListener("input", function () {

            this.value =
                this.value
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, "")
                .slice(0, 1);

            if (
                this.value !== "" &&
                index < panInputs.length - 1
            ) {

                panInputs[index + 1].focus();

            }

        });


        input.addEventListener("keydown", function (event) {

            if (
                event.key === "Backspace" &&
                this.value === "" &&
                index > 0
            ) {

                panInputs[index - 1].focus();

            }

        });


        input.addEventListener("paste", function (event) {

            event.preventDefault();

            const pasted =
                (event.clipboardData || window.clipboardData)
                .getData("text")
                .toUpperCase()
                .replace(/[^A-Z0-9]/g, "")
                .slice(0, 10);

            pasted.split("").forEach((character, i) => {

                if (panInputs[i]) {

                    panInputs[i].value = character;

                }

            });

            if (pasted.length > 0) {

                const nextIndex =
                    Math.min(
                        pasted.length,
                        panInputs.length
                    ) - 1;

                panInputs[nextIndex].focus();

            }

        });

    });

</script>
